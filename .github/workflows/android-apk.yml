name: Build Android APK

# Builds a sideloadable debug APK in the cloud (no local machine / Android SDK
# needed) and publishes it to a GitHub Release so it can be downloaded and
# installed directly on a phone. Debug-signed is fine for sideloading.
#
# Trigger it from the GitHub website/app: Actions -> "Build Android APK" ->
# "Run workflow". It also runs automatically on pushes to the feature branch.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/app-review-summary-vyxPj
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Supabase secrets are present
        run: |
          test -n "${{ secrets.VITE_SUPABASE_URL }}" || { echo "::error::VITE_SUPABASE_URL secret is missing — APK would ship a placeholder Supabase URL and login would fail. Add it in repo Settings -> Secrets and variables -> Actions."; exit 1; }
          test -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" || { echo "::error::VITE_SUPABASE_ANON_KEY secret is missing."; exit 1; }

      - name: Build web bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk go-out-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-out-debug-apk
          path: go-out-debug.apk

      - name: Publish to release (phone-installable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug
          name: GO-OUT Android (debug)
          body: |
            Latest debug APK built from `${{ github.sha }}`.
            Download **go-out-debug.apk** below on your phone and open it to
            install (allow "install from unknown sources" once). The savings
            widget then appears under long-press -> Widgets -> GO-OUT.
          prerelease: true
          files: go-out-debug.apk

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Saving - Chart Reference Only</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@100..900&family=Noto+Sans+Thai:wght@100..900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#a04100",
            "primary-container": "#ff6b00",
            "primary-fixed-dim": "#ffb693",
            tertiary: "#665d55",
            "on-surface": "#1c1b1a",
            "on-surface-variant": "#5a4136",
            "surface-container-low": "#f8f3f0",
            "outline-variant": "#e2bfb0"
          },
          fontFamily: {
            "label-md": ["Azeret Mono"],
            "label-sm": ["Azeret Mono"],
            "headline-sm": ["Azeret Mono"],
            "data-lg": ["Azeret Mono"],
            "body-main": ["Noto Sans Thai"]
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen bg-white p-6 font-body-main">
  <!-- Chart-only reference: Savings Performance -->
  <section class="max-w-md mx-auto">
    <div class="rounded-[2rem] p-6 shadow-[0_18px_50px_rgba(112,102,94,0.14)] border border-[#c8d2e1]/75 bg-white text-[#1c1b1a] overflow-hidden">
      <div class="flex justify-between items-start mb-6">
        <div>
          <h3 class="font-label-md text-[12px] tracking-[0.08em] mb-2 flex items-center gap-1 text-[#5a4136]">
            <span class="material-symbols-outlined text-[16px] text-[#ff6b00]">insights</span>
            Savings Performance
          </h3>

          <div class="flex items-baseline gap-2">
            <span class="font-data-lg text-[32px] font-bold text-[#1c1b1a]">฿ 14,300</span>
            <span class="font-label-sm text-[11px] text-[#5a4136]/75">Last 7 Days</span>
          </div>
        </div>
      </div>

      <div class="flex gap-6 mb-8">
        <div>
          <div class="font-label-sm text-[11px] mb-1 flex items-center gap-1 text-[#5a4136]">
            <span class="w-2 h-2 rounded-full bg-[#ff6b00] shadow-[0_0_10px_rgba(255,107,0,0.75)]"></span>
            Art
          </div>
          <div class="font-headline-sm text-[20px] text-[#1c1b1a]">฿ 8,900</div>
        </div>

        <div>
          <div class="font-label-sm text-[11px] mb-1 flex items-center gap-1 text-[#5a4136]">
            <span class="w-2 h-2 rounded-full bg-[#4f6382] shadow-[0_0_10px_rgba(79,99,130,0.36)]"></span>
            Phan
          </div>
          <div class="font-headline-sm text-[20px] text-[#1c1b1a]">฿ 5,400</div>
        </div>
      </div>

      <div class="relative w-full h-[200px] flex items-end justify-between mt-4">
        <div class="absolute inset-0 flex flex-col justify-between border-b border-[#c8d2e1]/65 pb-6 pointer-events-none">
          <div class="w-full border-t border-[#c8d2e1]/45"></div>
          <div class="w-full border-t border-[#c8d2e1]/45"></div>
          <div class="w-full border-t border-[#c8d2e1]/45"></div>
          <div class="w-full border-t border-[#c8d2e1]/45"></div>
        </div>

        <!-- M -->
        <div class="relative flex flex-col items-center gap-2 z-10 w-8 h-full justify-end">
          <div class="flex items-end gap-1 w-full h-[calc(100%-24px)]">
            <div class="w-full bg-gradient-to-t from-[#2d3f5f]/20 to-[#4f6382] rounded-t-full h-[30%] shadow-[0_0_14px_rgba(79,99,130,0.28)]"></div>
            <div class="w-full bg-gradient-to-t from-[#ff6b00]/20 to-[#ff8a2a] rounded-t-full h-[15%] shadow-[0_0_14px_rgba(255,107,0,0.45)]"></div>
          </div>
          <span class="font-label-sm text-[11px] text-[#5a4136]/75">M</span>
        </div>

        <!-- T -->
        <div class="relative flex flex-col items-center gap-2 z-10 w-8 h-full justify-end">
          <div class="flex items-end gap-1 w-full h-[calc(100%-24px)]">
            <div class="w-full bg-gradient-to-t from-[#2d3f5f]/20 to-[#4f6382] rounded-t-full h-[20%] shadow-[0_0_14px_rgba(79,99,130,0.28)]"></div>
            <div class="w-full bg-gradient-to-t from-[#ff6b00]/20 to-[#ff8a2a] rounded-t-full h-[35%] shadow-[0_0_14px_rgba(255,107,0,0.45)]"></div>
          </div>
          <span class="font-label-sm text-[11px] text-[#5a4136]/75">T</span>
        </div>

        <!-- W -->
        <div class="relative flex flex-col items-center gap-2 z-10 w-8 h-full justify-end">
          <div class="flex items-end gap-1 w-full h-[calc(100%-24px)]">
            <div class="w-full bg-gradient-to-t from-[#2d3f5f]/20 to-[#4f6382] rounded-t-full h-[40%] shadow-[0_0_14px_rgba(79,99,130,0.28)]"></div>
            <div class="w-full bg-gradient-to-t from-[#ff6b00]/20 to-[#ff8a2a] rounded-t-full h-[25%] shadow-[0_0_14px_rgba(255,107,0,0.45)]"></div>
          </div>
          <span class="font-label-sm text-[11px] text-[#5a4136]/75">W</span>
        </div>

        <!-- T -->
        <div class="relative flex flex-col items-center gap-2 z-10 w-8 h-full justify-end">
          <div class="flex items-end gap-1 w-full h-[calc(100%-24px)]">
            <div class="w-full bg-gradient-to-t from-[#2d3f5f]/20 to-[#4f6382] rounded-t-full h-[50%] shadow-[0_0_14px_rgba(79,99,130,0.28)]"></div>
            <div class="w-full bg-gradient-to-t from-[#ff6b00]/20 to-[#ff8a2a] rounded-t-full h-[60%] shadow-[0_0_14px_rgba(255,107,0,0.45)]"></div>
          </div>
          <span class="font-label-sm text-[11px] text-[#5a4136]/75">T</span>
        </div>

        <!-- F -->
        <div class="relative flex flex-col items-center gap-2 z-10 w-8 h-full justify-end">
          <div class="flex items-end gap-1 w-full h-[calc(100%-24px)]">
            <div class="w-full bg-gradient-to-t from-[#2d3f5f]/20 to-[#4f6382] rounded-t-full h-[45%] shadow-[0_0_14px_rgba(79,99,130,0.28)]"></div>
            <div class="w-full bg-gradient-to-t from-[#ff6b00]/20 to-[#ff8a2a] rounded-t-full h-[55%] shadow-[0_0_14px_rgba(255,107,0,0.45)]"></div>
          </div>
          <span class="font-label-sm text-[11px] text-[#5a4136]/75">F</span>
        </div>

        <!-- S -->
        <div class="relative flex flex-col items-center gap-2 z-10 w-8 h-full justify-end">
          <div class="flex items-end gap-1 w-full h-[calc(100%-24px)]">
            <div class="w-full bg-gradient-to-t from-[#2d3f5f]/20 to-[#4f6382] rounded-t-full h-[70%] shadow-[0_0_14px_rgba(79,99,130,0.32)]"></div>
            <div class="w-full bg-gradient-to-t from-[#ff6b00]/20 to-[#ff8a2a] rounded-t-full h-[80%] shadow-[0_0_16px_rgba(255,107,0,0.55)]"></div>
          </div>
          <span class="font-label-sm text-[11px] text-[#5a4136]/75">S</span>
        </div>

        <!-- S -->
        <div class="relative flex flex-col items-center gap-2 z-10 w-8 h-full justify-end">
          <div class="flex items-end gap-1 w-full h-[calc(100%-24px)]">
            <div class="w-full bg-gradient-to-t from-[#2d3f5f]/20 to-[#4f6382] rounded-t-full h-[75%] shadow-[0_0_16px_rgba(79,99,130,0.36)]"></div>
            <div class="w-full bg-gradient-to-t from-[#ff6b00]/20 to-[#ff8a2a] rounded-t-full h-[90%] shadow-[0_0_18px_rgba(255,107,0,0.65)] relative">
              <div class="absolute -top-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full border-2 border-[#ff6b00]"></div>
            </div>
          </div>
          <span class="font-label-sm text-[11px] text-[#ff6b00]">S</span>
        </div>

        <svg class="absolute inset-0 w-full h-[calc(100%-24px)] pointer-events-none z-20" preserveAspectRatio="none" viewBox="0 0 100 100">
          <polyline
            fill="none"
            points="7,80 21,75 35,65 49,45 64,50 78,25 93,10"
            stroke="#ff6b00"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.6"
            class="opacity-90"
          ></polyline>

          <circle cx="7" cy="80" r="1.6" fill="#ffffff" stroke="#ff6b00" stroke-width="1"></circle>
          <circle cx="21" cy="75" r="1.6" fill="#ffffff" stroke="#ff6b00" stroke-width="1"></circle>
          <circle cx="35" cy="65" r="1.6" fill="#ffffff" stroke="#ff6b00" stroke-width="1"></circle>
          <circle cx="49" cy="45" r="1.6" fill="#ffffff" stroke="#ff6b00" stroke-width="1"></circle>
          <circle cx="64" cy="50" r="1.6" fill="#ffffff" stroke="#ff6b00" stroke-width="1"></circle>
          <circle cx="78" cy="25" r="1.6" fill="#ffffff" stroke="#ff6b00" stroke-width="1"></circle>
          <circle cx="93" cy="10" r="1.6" fill="#ffffff" stroke="#ff6b00" stroke-width="1"></circle>
        </svg>
      </div>
    </div>
  </section>
</body>
</html>
